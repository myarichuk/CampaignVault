name: Air Elemental
system: dnd5e
description: A funneling cloud of whistling air, summoned forth as an elemental servant.
level: 0
challengeRating: "5"
hp: 90
defense: 15
abilities:
  - "Speed: fly 90 ft. (hover)."
  - "Resistant to lightning and thunder damage and to bludgeoning, piercing, and slashing from nonmagical weapons."
  - "Immune to poison damage."
  - "Condition immunities: exhaustion, grappled, paralyzed, petrified, poisoned, prone, restrained, unconscious."
  - "Darkvision: 60 ft."
  - "Slam (Melee Weapon Attack): +8 to hit, reach 5 ft., one target. Hit: 14 (2d8 + 5) bludgeoning damage."
