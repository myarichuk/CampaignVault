# Necromancer's Grimoire (original homebrew, not an SRD entry).
# A minor devil that signed the wrong contract and now takes orders literally.
name: Impish Trickster
system: dnd5e
description: A cat-sized fiend with an oversized grin and a binding clause.
level: 0
challengeRating: "1/2"
hp: 10
defense: 13
skills:
  - "Deception +5"
abilities:
  - "Sting (Melee Weapon Attack): +5 to hit, reach 5 ft., one target. Hit: 5 (1d4 + 3) piercing damage."
  - "Resistant to fire damage and to bludgeoning, piercing, and slashing damage from nonmagical weapons."
  - "Literal Obedience: follows the letter of commands; the GM twists careless wording."
