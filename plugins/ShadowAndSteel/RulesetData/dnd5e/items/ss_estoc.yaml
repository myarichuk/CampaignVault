name: ss_estoc
system: dnd5e
category: Weapon
tags: [martial, melee, finesse, versatile]
description: A long, stiff thrust-only sword built to punch through mail and find plate joints. Deals 1d8 piercing damage (1d10 two-handed).
properties:
  damage: 1d8
  damageVersatile: 1d10
  damageType: piercing
  weight: 4
  costGp: 40
  specialMechanic: "Against targets in heavy armor, deals +1 damage per die (narrative/GM-arbitrated; not computed by the engine). No bonus against unarmored targets."
equipZones: [MainHand]
equipLayer: Held
twoHanded: false
