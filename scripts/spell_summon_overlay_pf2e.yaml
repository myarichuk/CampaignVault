# Hand-authored summon metadata for pf2e Remaster (ORC) spells. NEVER regenerated
# from the API — merged into the generated pf2e spell YAMLs verbatim by
# generate_spells.py (same pattern as the dnd5e summon overlay).
#
# Evidentiary standard: every entry cites verified Archives of Nethys data —
# no entry without a source. Durations below are the spells' AoN duration_raw
# values ("sustained up to 1 minute" = 10 combat rounds at 6s/round); ranks are
# the AoN spell levels. PF2e summon spells conjure exactly one minion per cast
# (heightened ranks raise the creature's level, never the headcount), so every
# count table holds a single rank entry and higher ranks fall back to it.
# Sustained PF2e summons end when the caster stops sustaining: lapse keeps
# loyal, and every entry here is concentration-flagged upstream, so control
# rides on concentration.
#
# Deferred (same shape when needed): summon_giant, summon_instrument (summons
# an OBJECT, like instant_summons — excluded from the minion model),
# summon_lesser_servitor, summon_monitor, summon_plant_or_fungus.

summon_undead:
  # Rank 1. The rank-1 undead servitor: the catalog's Skeleton Guard.
  # Higher ranks summon stronger undead from the spell's list (maxHp path).
  creatures: [skeleton_guard]
  countAtSlotLevel:
    1: 1
  # AoN duration_raw: "sustained up to 1 minute".
  durationRounds: 10
  disposition: loyal

summon_animal:
  # Rank 1. The catalog's Wolf stands in for the rank-1 animal options;
  # other ranks/choices pass maxHp explicitly.
  creatures: [wolf]
  countAtSlotLevel:
    1: 1
  # AoN duration_raw: "sustained up to 1 minute".
  durationRounds: 10
  disposition: loyal

summon_fey:
  # Rank 1. No catalog fey exists: casts pass maxHp for the spell's rank-1 fey.
  inlineSeed:
    attacks: ["Fey's own attack: the GM applies the spell's rank-appropriate fey statistics and passes maxHp explicitly."]
  countAtSlotLevel:
    1: 1
  # AoN duration_raw: "sustained up to 1 minute".
  durationRounds: 10
  disposition: loyal

