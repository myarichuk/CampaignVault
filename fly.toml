# fly.toml app configuration file generated for campaign-vault

app = "my-campaign-vault-for-grok"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[mounts]]
  source = "campaign_data"
  destination = "/app/data"

[env]
  CAMPAIGN_DB_PATH = "/app/data/campaign.db"
  MCP_PORT = "8080"
  MCP_BIND_ANY = "1"
  MCP_HOSTING_PROFILE = "remote"
  MCP_STATELESS = "1"
