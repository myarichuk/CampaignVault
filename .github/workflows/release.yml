# Manual release: Actions → Release → Run workflow, give a tag.
# Runs CI, builds the Unity client for Windows, Linux and macOS (all on Linux
# runners through GameCI; the macOS build is unsigned), each with its embedded
# server, and publishes them as a GitHub Release.
#
# Secrets (Settings → Secrets and variables → Actions):
#   UNITY_LICENSE   contents of Unity_lic.ulf (Personal license)
#   UNITY_EMAIL     Unity account email
#   UNITY_PASSWORD  Unity account password
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create, e.g. v0.1.0
        required: true
      prerelease:
        description: Mark as a pre-release
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # The legs share one Unity Personal seat (activate + return per leg); serial runs rule out
      # seat contention while the intermittent Windows "Killed" (exit 137) is being diagnosed.
      max-parallel: 1
      matrix:
        include:
          - { target: StandaloneWindows64, method: BuildStandaloneWindows64, rid: win-x64,   name: windows-x64 }
          - { target: StandaloneLinux64,   method: BuildStandaloneLinux64,   rid: linux-x64, name: linux-x64 }
          - { target: StandaloneOSX,       method: BuildStandaloneOSX,       rid: osx-arm64, name: macos-arm64 }
    steps:
      # Unity editor images are large; the default runner is tight on disk.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v7
      - id: lfs
        run: echo "id=$(git lfs ls-files -l | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ steps.lfs.outputs.id }}
      - run: git lfs pull

      # The GameCI container has no dotnet SDK, so the server is published here
      # and the build picks it up via -vaultPrestagedServer.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: tools/embed-server.sh ${{ matrix.rid }}

      - uses: actions/cache@v6
        with:
          path: UnityClient/Library
          # Bump the v-suffix to discard a suspect Library cache (restore-keys carries it too, so
          # an older generation is never restored).
          key: Library-v2-${{ matrix.target }}-${{ hashFiles('UnityClient/Packages/packages-lock.json', 'UnityClient/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-v2-${{ matrix.target }}-

      - uses: game-ci/unity-builder@v6
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: UnityClient
          targetPlatform: ${{ matrix.target }}
          buildMethod: CampaignVault.UnityClient.Editor.BuildTools.${{ matrix.method }}
          customParameters: -vaultPrestagedServer
          versioning: None
          # unity-builder@v6 downloads a separate game-ci CLI; unpinned it follows "latest" and its
          # post-build check (needs "Build succeeded!" in the log, see BuildTools) can change under us.
          cliVersion: v0.1.70

      # Exit 137 is a SIGKILL; the editor log doesn't say who sent it. Leave host-side evidence
      # (memory, kernel OOM-killer lines, container exit state) for the next failure.
      - name: Diagnose Unity kill
        if: failure()
        run: |
          free -h
          df -h /
          sudo dmesg 2>&1 | grep -iE 'out of memory|oom|killed process' | tail -20 || true
          docker ps -a --no-trunc --format '{{.Image}} {{.Status}}' | head -5 || true

      - name: Package
        env:
          TAG: ${{ inputs.tag }}
        run: |
          sudo chown -R "$(id -u):$(id -g)" build
          cd "build/${{ matrix.target }}"
          rm -rf ./*_BurstDebugInformation_DoNotShip ./*_BackUpThisFolder_ButDontShipItWithYourGame
          zip -qry "$GITHUB_WORKSPACE/CampaignVault-$TAG-${{ matrix.name }}.zip" .

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: CampaignVault-${{ inputs.tag }}-${{ matrix.name }}.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            ${{ inputs.prerelease && '--prerelease' || '' }}
