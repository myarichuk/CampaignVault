      - wizard spellcasting
      - arcane bond
      - name: "Arcane school"
        choices:
          school:
            type: Enum
            required: true
            options:
              - id: schoolOfArsGrammatica
                label: "School of Ars Grammatica"
                description: "Runes and wards, numbers and letters—they underpin all magic, making them the logical subject for a wizard who studies fundamental forces."
              - id: schoolOfBattleMagic
                label: "School of Battle Magic"
                description: "Magic is power, and there are always those who will use power for the art of battle."
              - id: schoolOfCivicWizardry
                label: "School of Civic Wizardry"
                description: "You've learned the humble art of construction, of finding lost people and things, of moving speedily among buildings and moats—yet these same arts can be turned to demolition, and the constructs you animate to build bridges can just as easily tear them down."
              - id: schoolOfMentalism
                label: "School of Mentalism"
                description: "As a scholar, you know all too well the importance of a sound mind."
              - id: schoolOfProteanForm
                label: "School of Protean Form"
                description: "The uninitiated often think of wizards as cerebral, focused on their studies more than the body, yet your school of magic taught of the relationship between the two."
              - id: schoolOfTheBoundary
                label: "School of the Boundary"
                description: "Why use your magic to affect something as pedestrian as the physical world?"
              - id: schoolOfUnifiedMagicalTheory
                label: "School of Unified Magical Theory"
                description: "You eschew the idea that magic can be neatly expressed by the teachings of any single school or college, instead directing your self-study to pick up the best of every school of magic."
      - name: "Arcane thesis"
        choices:
          thesis:
            type: Enum
            required: true
            options:
              - id: experimentalSpellshaping
                label: "Experimental Spellshaping"
                description: "Your thesis posits that the magical practice of spellshaping can be realized more efficiently by altering variables and parameters as you cast, imitating the wizards of long ago who had to work out their own spells themselves."
              - id: improvedFamiliarAttunement
                label: "Improved Familiar Attunement"
                description: "You've long held that fine-tuning the magic that bonds a wizard and their familiar can improve the mystic connection and yield greater results, compared to the safe yet generic bond most wizards currently use."
              - id: spellBlending
                label: "Spell Blending"
                description: "You theorize that spell slots are a shorthand for an underlying energy that powers all spellcasting, and you've found a way to tinker with the hierarchy of spell slots, combining them to fuel more powerful spells."
              - id: spellSubstitution
                label: "Spell Substitution"
                description: "You don't accept the fact that once spells are prepared, they can't be changed until your next daily preparations, and you have uncovered a shortcut allowing you to substitute new spells for those you originally prepared."
              - id: staffNexus
                label: "Staff Nexus"
                description: "Your thesis maintains that early and intense adoption of staves from the first days of study can create a symbiotic bond between spellcaster and staff, allowing them to create remarkable magic together."
