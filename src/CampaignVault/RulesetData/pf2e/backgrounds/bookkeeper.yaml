name: bookkeeper
system: pf2e
description: "You ran the numbers on a large farm, for a merchant's endeavors, or with a major guild in the city. You kept track of expenses, payroll, profits, and anything else that had to do with money, for better or worse. If better, you might be adventuring to learn how others ply this trade. If worse, you may be fleeing from impending consequences in the hope that no one finds you."
boosts: [Intelligence, Wisdom]
skillProficiencies: [Society]
lore: Accounting Lore
skillFeat: eye_for_numbers
feature: Eye for Numbers
