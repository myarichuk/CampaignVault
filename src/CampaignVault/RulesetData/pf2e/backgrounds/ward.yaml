name: ward
system: pf2e
description: "When you were young, you became the ward of another house— boarded, fed, and educated, but never quite a part of the family. Perhaps you had to tend to their needs in return for feeding and raising you, or perhaps you were provided for but disregarded. Now, adventuring is your chance to grow and roam free."
boosts: [Constitution, Charisma]
skillProficiencies: [Performance]
lore: Genealogy Lore
skillFeat: fascinating_performance
feature: Fascinating Performance
