name: astrologer
system: pf2e
description: "Astrologers look to the stars for signs and portents, using their positions in the heavens to chart courses for those living beneath them. As the celestial spheres move, so does fate itself. You studied the stars and learned to divine your path based on their guidance. Whether the stars directly called you to a life of adventure or you use the stars to guide your wanderlust, you're living out the stars' guidance in a life of adventure."
boosts: [Intelligence, Wisdom]
skillProficiencies: [Occultism]
lore: Astrology Lore
skillFeat: oddity_identification
feature: Oddity Identification
