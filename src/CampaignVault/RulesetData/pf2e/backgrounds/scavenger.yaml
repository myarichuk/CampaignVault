name: scavenger
system: pf2e
description: "You've made a living sorting through the things society throws away. You might have scavenged simply to survive, or plied a trade as a ragpicker, dung carter, or the like. While you've left that life behind, you still keep one eye on the ground out of habit."
boosts: [Intelligence, Wisdom]
skillProficiencies: [Survival]
lore: Lore for the settlement you grew up scavenging in
