name: pilgrim
system: pf2e
description: "In your youth, you made several pilgrimages to important shrines and sacred sites. You might have been a mendicant friar, a seller of religious relics (real or fraudulent), or just a simple farmer following the dictates of your faith. Whatever the aims of your wanderings now, your faith still protects you on the road."
boosts: [Wisdom, Charisma]
skillProficiencies: [Religion]
