name: charlatan
system: pf2e
description: "You traveled from place to place, peddling false fortunes and snake oil in one town, pretending to be royalty in exile to seduce a wealthy heir in the next. Becoming an adventurer might be your next big scam or an attempt to put your talents to use for a greater cause. Perhaps it’s a bit of both, as you realize that after pretending to be a hero, you’ve become the mask."
boosts: [Intelligence, Charisma]
skillProficiencies: [Deception]
lore: Underworld Lore
skillFeat: charming_liar
feature: Charming Liar
