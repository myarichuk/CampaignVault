# Source: SRD 5.1 by Wizards of the Coast LLC, CC BY 4.0
name: bard
system: dnd5e
className: Bard
hitDie: d8
aliases: [bard]
keyAbility: [Charisma]
savingThrows: [Dexterity, Charisma]
levels:
  1:
    cantripsKnown: 2
    spellsKnown: 4
    proficiencyBonus: 2
    features:
      - name: "Spellcasting"
        description: "Cha is spellcasting ability. Know 2 cantrips, 4 spells. Ritual casting."
        spellSlots: {1: 2}
      - name: "Bardic Inspiration (d6)"
        description: "Bonus action: creature gains d6 to add to one roll in 10 min. Cha mod uses per long rest."
  2:
    spellsKnown: 5
    proficiencyBonus: 2
    features:
      - name: "Jack of All Trades"
        description: "Add half proficiency (rounded down) to any ability check not proficient."
      - name: "Song of Rest (d6)"
        description: "Allies regain extra 1d6 HP during short rest."
    spellSlots: {1: 3}
  3:
    spellsKnown: 6
    proficiencyBonus: 2
    features:
      - name: "Bard College"
        description: "Choose a bard college."
        choices:
          subclass:
            type: Enum
            required: true
            options:
              - id: lore
                label: "College of Lore"
                description: "Bonus proficiencies, cutting words, additional magical secrets, peerless skill."
                features:
                  3:
                    - name: "Bonus Proficiencies"
                      description: "Proficiency with three skills of your choice."
                      choices:
                        skills:
                          type: "SkillProficiency"
                          required: true
                          count: 3
                          prompt: "Bonus Proficiencies"
                    - name: "Cutting Words"
                      description: "Reaction when a creature you can see within 60 ft. makes an attack roll, ability check or damage roll: spend one use of Bardic Inspiration, roll the die and subtract it from the roll. Works before or after the roll, before the DM says how it turned out; not on a creature that can't hear you or is immune to being charmed."
                  6:
                    - name: "Additional Magical Secrets"
                      description: "Learn two spells of your choice from any class. They must be of a level you can cast or cantrips, count as bard spells, and don't count against your bard spells known."
                  14:
                    - name: "Peerless Skill"
                      description: "When you make an ability check, you can spend one use of Bardic Inspiration and add the die to the roll, after rolling but before the DM says how it turned out."
    spellSlots: {1: 4, 2: 2}
  4:
    cantripsKnown: 3
    spellsKnown: 7
    proficiencyBonus: 2
    features:
      - name: "Ability Score Improvement"
        choices:
          asiOrFeat:
            type: AsiOrFeat
            required: true
      - name: "Expertise"
        description: "Double proficiency for two chosen skills."
    spellSlots: {1: 4, 2: 3}
  5:
    spellsKnown: 8
    proficiencyBonus: 3
    features:
      - name: "Bardic Inspiration (d8)"
        description: "Inspiration die improves to d8."
      - name: "Font of Inspiration"
        description: "Regain all uses on short or long rest."
    spellSlots: {1: 4, 2: 3, 3: 2}
  6:
    spellsKnown: 9
    proficiencyBonus: 3
    features:
      - name: "Countercharm"
        description: "Advantage on saves vs frightened/charmed. Allies within 30 ft also benefit."
    spellSlots: {1: 4, 2: 3, 3: 3}
  7:
    spellsKnown: 10
    proficiencyBonus: 3
    features:
      - name: "College Feature"
        description: "Gain a feature from your bard college."
    spellSlots: {1: 4, 2: 3, 3: 3}
  8:
