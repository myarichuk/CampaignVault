# Source: SRD 5.1 by Wizards of the Coast LLC, CC BY 4.0
name: bard
system: dnd5e
className: Bard
hitDie: d8
aliases: [bard]
keyAbility: [Charisma]
savingThrows: [Dexterity, Charisma]
levels:
  1:
    proficiencyBonus: 2
    features:
      - name: "Spellcasting"
        description: "Cha is spellcasting ability. Know 2 cantrips, 4 spells. Ritual casting."
        spellSlots: {1: 2}
      - name: "Bardic Inspiration (d6)"
        description: "Bonus action: creature gains d6 to add to one roll in 10 min. Cha mod uses per long rest."
  2:
    proficiencyBonus: 2
    features:
      - name: "Jack of All Trades"
        description: "Add half proficiency (rounded down) to any ability check not proficient."
      - name: "Song of Rest (d6)"
        description: "Allies regain extra 1d6 HP during short rest."
    spellSlots: {1: 3}
  3:
    proficiencyBonus: 2
    features:
      - name: "Bard College"
        description: "Choose a bard college."
        choices:
          subclass:
            type: Enum
            required: true
            options:
              - id: lore
                label: "College of Lore"
                description: "Bonus proficiencies, Cutting Words, Additional Magical Secrets, Peerless Skill."
              - id: valor
                label: "College of Valor"
                description: "Bonus proficiencies, Combat Inspiration, Extra Attack, Battle Magic."
              - id: glamour
                label: "College of Glamour"
                description: "Mantle of Inspiration, Enthralling Performance, Mantle of Majesty, Unbreakable Majesty."
    spellSlots: {1: 4, 2: 2}
  4:
    proficiencyBonus: 2
    features:
      - name: "Ability Score Improvement"
        choices:
          asiOrFeat:
            type: AsiOrFeat
            required: true
      - name: "Expertise"
        description: "Double proficiency for two chosen skills."
    spellSlots: {1: 4, 2: 3}
  5:
    proficiencyBonus: 3
    features:
      - name: "Bardic Inspiration (d8)"
        description: "Inspiration die improves to d8."
      - name: "Font of Inspiration"
        description: "Regain all uses on short or long rest."
    spellSlots: {1: 4, 2: 3, 3: 2}
  6:
    proficiencyBonus: 3
    features:
      - name: "Countercharm"
        description: "Advantage on saves vs frightened/charmed. Allies within 30 ft also benefit."
    spellSlots: {1: 4, 2: 3, 3: 3}
  7:
    proficiencyBonus: 3
    features:
      - name: "College Feature"
        description: "Gain a feature from your bard college."
    spellSlots: {1: 4, 2: 3, 3: 3}
  8:
    proficiencyBonus: 3
    features:
      - name: "Ability Score Improvement"
        choices:
          asiOrFeat:
            type: AsiOrFeat
            required: true
      - name: "Expertise"
        description: "Double proficiency for two more skills."
    spellSlots: {1: 4, 2: 3, 3: 3}
  9:
    proficiencyBonus: 4
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 1}
  10:
    proficiencyBonus: 4
    features:
      - name: "Bardic Inspiration (d10)"
        description: "Inspiration die improves to d10."
      - name: "Expertise"
        description: "Double proficiency for two more skills."
      - name: "Magical Secrets"
        description: "Learn two spells from any class (count as bard spells)."
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 2}
  11:
    proficiencyBonus: 4
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 3}
  12:
    proficiencyBonus: 4
    features:
      - name: "Ability Score Improvement"
        choices:
          asiOrFeat:
            type: AsiOrFeat
            required: true
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 3}
  13:
    proficiencyBonus: 5
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 1}
  14:
    proficiencyBonus: 5
    features:
      - name: "College Feature"
        description: "Gain a feature from your bard college."
      - name: "Magical Secrets"
        description: "Learn two more spells from any class."
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 1}
  15:
    proficiencyBonus: 5
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 2}
  16:
    proficiencyBonus: 5
    features:
      - name: "Ability Score Improvement"
        choices:
          asiOrFeat:
            type: AsiOrFeat
            required: true
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 2}
  17:
    proficiencyBonus: 6
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 2, 6: 1}
  18:
    proficiencyBonus: 6
    features:
      - name: "Magical Secrets"
        description: "Learn two more spells from any class."
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 2, 6: 1}
  19:
    proficiencyBonus: 6
    features:
      - name: "Ability Score Improvement"
        choices:
          asiOrFeat:
            type: AsiOrFeat
            required: true
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 2, 6: 2}
  20:
    proficiencyBonus: 6
    features:
      - name: "Superior Inspiration"
        description: "Roll initiative with no uses of Bardic Inspiration: regain one use."
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 2, 6: 2}