# Source: SRD 5.1 by Wizards of the Coast LLC, CC BY 4.0
name: paladin
system: dnd5e
className: Paladin
hitDie: d10
aliases: [paladin]
savingThrows: [Wisdom, Charisma]
preparedSpells: { ability: Charisma, levelDivisor: 2, fromLevel: 2 }
levels:
  1:
    proficiencyBonus: 2
    features:
      - name: "Divine Sense"
        description: "Detect celestials, fiends, undead within 60 ft. 1+Cha mod/day."
      - name: "Lay on Hands"
        description: "Pool of 5 * paladin level HP to heal or cure disease/poison."
  2:
    proficiencyBonus: 2
    features:
      - name: "Fighting Style"
        description: "Choose: Defense, Dueling, Great Weapon Fighting or Protection."
        choices:
          fightingStyle:
            type: Enum
            required: true
            options:
              - id: defense
                label: "Defense"
                description: "+1 AC while wearing armor."
                effects:
                  - { kind: armorClassBonus, value: 1, assert: [wearingArmor], when: "the character is wearing armor" }
              - id: protection
                label: "Protection"
                description: "Impose disadvantage on attacks against allies within 5 ft."
              - id: dueling
                label: "Dueling"
                description: "+2 damage with one-handed melee weapon."
                effects:
                  - { kind: damageBonus, value: 2, weapon: [melee, oneHanded] }
              - id: greatWeaponFighting
                label: "Great Weapon Fighting"
                description: "Reroll 1s and 2s on damage dice for two-handed weapons."
      - name: "Spellcasting"
        description: "Prepare paladin spells. Cha is spellcasting ability."
        spellSlots: {1: 2}
  3:
    proficiencyBonus: 2
    features:
      - name: "Divine Health"
        description: "Immune to disease."
      - name: "Sacred Oath"
        description: "Choose a sacred oath."
        choices:
          subclass:
            type: Enum
            required: true
            options:
              - id: devotion
                label: "Oath of Devotion"
                description: "Oath spells, sacred weapon, turn the unholy, aura of devotion, purity of spirit, holy nimbus."
                features:
                  3:
                    - name: "Oath Spells"
                      description: "Always prepared, and not counted against the spells you prepare."
                      spells:
                        3: ["protection_from_evil_and_good", "sanctuary"]
                        5: ["lesser_restoration", "zone_of_truth"]
                        9: ["beacon_of_hope", "dispel_magic"]
                        13: ["freedom_of_movement", "guardian_of_faith"]
                        17: ["commune", "flame_strike"]
                    - name: "Channel Divinity: Sacred Weapon"
                      description: "Action: for 1 minute, add your Charisma modifier (at least +1) to attack rolls with one weapon you hold. It sheds bright light in a 20-ft. radius and counts as magical."
                    - name: "Channel Divinity: Turn the Unholy"
                      description: "Action: each fiend or undead within 30 ft. that can see or hear you makes a Wisdom save or is turned for 1 minute or until it takes damage."
                  7:
                    - name: "Aura of Devotion"
                      description: "You and friendly creatures within 10 ft. of you can't be charmed while you're conscious. The aura reaches 30 ft. at 18th level."
                  15:
                    - name: "Purity of Spirit"
                      description: "You're always under the effects of a protection from evil and good spell."
                  20:
                    - name: "Holy Nimbus"
                      description: "Action, once per long rest: for 1 minute you shine bright light in a 30-ft. radius; enemies starting their turn in it take 10 radiant damage, and you have advantage on saves against spells cast by fiends or undead."
    spellSlots: {1: 3}
  4:
    proficiencyBonus: 2
    features:
      - name: "Ability Score Improvement"
        choices:
          asiOrFeat:
            type: AsiOrFeat
            required: true
    spellSlots: {1: 3}
  5:
    proficiencyBonus: 3
    features:
      - name: "Extra Attack"
        description: "Attack twice when you take the Attack action."
    spellSlots: {1: 4, 2: 2}
  6:
    proficiencyBonus: 3
    features:
      - name: "Aura of Protection"
        description: "You and allies within 10 ft add Cha mod to saving throws (min +1)."
    spellSlots: {1: 4, 2: 3}
  7:
    proficiencyBonus: 3
    features:
      - name: "Oath Feature"
        description: "Gain a feature from your sacred oath."
    spellSlots: {1: 4, 2: 3}
  8:
    proficiencyBonus: 3
    features:
      - name: "Ability Score Improvement"
        choices:
          asiOrFeat:
            type: AsiOrFeat
            required: true
    spellSlots: {1: 4, 2: 3}
  9:
    proficiencyBonus: 4
    spellSlots: {1: 4, 2: 3, 3: 2}
  10:
    proficiencyBonus: 4
    features:
      - name: "Aura of Courage"
        description: "You and allies within 10 ft can't be frightened while you're conscious."
    spellSlots: {1: 4, 2: 3, 3: 3}
  11:
    proficiencyBonus: 4
    features:
      - name: "Improved Divine Smite"
        description: "All melee weapon attacks deal +1d8 radiant damage."
    spellSlots: {1: 4, 2: 3, 3: 3}
  12:
    proficiencyBonus: 4
    features:
      - name: "Ability Score Improvement"
        choices:
          asiOrFeat:
            type: AsiOrFeat
            required: true
    spellSlots: {1: 4, 2: 3, 3: 3}
  13:
    proficiencyBonus: 5
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 1}
  14:
    proficiencyBonus: 5
    features:
      - name: "Cleansing Touch"
        description: "Use Lay on Hands to end spells. Cha mod times per long rest."
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 1}
  15:
    proficiencyBonus: 5
    features:
      - name: "Oath Feature"
        description: "Gain a feature from your sacred oath."
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 2}
  16:
    proficiencyBonus: 5
    features:
      - name: "Ability Score Improvement"
        choices:
          asiOrFeat:
            type: AsiOrFeat
            required: true
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 2}
  17:
    proficiencyBonus: 6
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 1}
  18:
    proficiencyBonus: 6
    features:
      - name: "Aura Improvements"
        description: "Aura of Protection and Courage range increases to 30 ft."
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 1}
  19:
    proficiencyBonus: 6
    features:
      - name: "Ability Score Improvement"
        choices:
          asiOrFeat:
            type: AsiOrFeat
            required: true
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 2}
  20:
    proficiencyBonus: 6
    features:
      - name: "Sacred Oath Feature"
        description: "Gain the capstone feature of your sacred oath."
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 2}