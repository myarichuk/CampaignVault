# Source: SRD 5.1 by Wizards of the Coast LLC, CC BY 4.0
name: monk
system: dnd5e
className: Monk
hitDie: d8
aliases: [monk]
savingThrows: [Strength, Dexterity]
levels:
  1:
    proficiencyBonus: 2
    features:
      - name: "Unarmored Defense"
        description: "AC = 10 + Dex mod + Wis mod (unarmored, no shield)."
        unarmoredArmorClass: { base: 10, abilities: [Dexterity, Wisdom] }
      - name: "Martial Arts"
        description: "Dex for unarmed/monk weapons. 1d4 damage (scales). Bonus action unarmed strike."
  2:
    proficiencyBonus: 2
    features:
      - name: "Ki"
        description: "Ki points = monk level. Flurry of Blows, Patient Defense, Step of the Wind."
      - name: "Unarmored Movement"
        description: "Speed +10 ft (increases). Not wearing armor/shield."
  3:
    proficiencyBonus: 2
    features:
      - name: "Monastic Tradition"
        description: "Choose a monastic tradition."
        choices:
          subclass:
            type: Enum
            required: true
            options:
              - id: openHand
                label: "Way of the Open Hand"
                description: "Open hand technique, wholeness of body, tranquility, quivering palm."
                features:
                  3:
                    - name: "Open Hand Technique"
                      description: "When a Flurry of Blows attack hits, you can impose one of: a Dexterity save or knocked prone; a Strength save or pushed up to 15 ft. away; or no reactions until the end of your next turn."
                  6:
                    - name: "Wholeness of Body"
                      description: "Once per long rest, as an action, regain hit points equal to three times your monk level."
                  11:
                    - name: "Tranquility"
                      description: "At the end of a long rest you gain the effect of a sanctuary spell until your next long rest (it can end early as the spell does). Save DC 8 + Wisdom modifier + proficiency bonus."
                  17:
                    - name: "Quivering Palm"
                      description: "When an unarmed strike hits, spend 3 ki to set lethal vibrations in the target for your monk level in days. Later, as an action, end them: the target makes a Constitution save, dropping to 0 hit points on a failure and taking 10d10 necrotic damage on a success."
      - name: "Deflect Missiles"
        description: "Reaction to reduce ranged damage by 1d10+Dex+lvl. Catch and throw back if 0."
  4:
    proficiencyBonus: 2
    features:
      - name: "Ability Score Improvement"
        choices:
          asiOrFeat:
            type: AsiOrFeat
            required: true
  5:
    proficiencyBonus: 3
    features:
      - name: "Extra Attack"
        description: "Attack twice when you take the Attack action."
      - name: "Stunning Strike"
        description: "Spend 1 ki: target Con save or stunned until end of your next turn."
  6:
    proficiencyBonus: 3
    features:
      - name: "Ki-Empowered Strikes"
        description: "Unarmed strikes count as magical for overcoming resistance."
 
      - name: "Monastic Tradition Feature"
        description: "Gain a feature from your monastic tradition."
  7:
    proficiencyBonus: 3
    features:
      - name: "Evasion"
        description: "Dex save for half damage: take none on success, half on failure."
      - name: "Stillness of Mind"
        description: "Action to end charmed/frightened on yourself."
  8:
    proficiencyBonus: 3
    features:
      - name: "Ability Score Improvement"
        choices:
          asiOrFeat:
            type: AsiOrFeat
            required: true
  9:
    proficiencyBonus: 4
    features:
      - name: "Unarmored Movement"
        description: "Speed +15 ft. Run on vertical surfaces/liquid."
  10:
    proficiencyBonus: 4
    features:
      - name: "Purity of Body"
        description: "Immune to disease and poison."
      - name: "Ability Score Improvement"
        choices:
          asiOrFeat:
            type: AsiOrFeat
            required: true
  11:
    proficiencyBonus: 4
    features:
      - name: "Monastic Tradition Feature"
        description: "Gain a feature from your monastic tradition."
  12:
    proficiencyBonus: 4
    features:
      - name: "Ability Score Improvement"
        choices:
          asiOrFeat:
            type: AsiOrFeat
            required: true
  13:
    proficiencyBonus: 5
    features:
      - name: "Tongue of the Sun and Moon"
        description: "Understand all spoken languages, any creature understands you."
  14:
    proficiencyBonus: 5
    features:
      - name: "Diamond Soul"
        description: "Proficiency in all saves. Spend 1 ki to reroll failed save."
  15:
    proficiencyBonus: 5
    features:
      - name: "Timeless Body"
        description: "Don't age, don't need food/water."
      - name: "Monastic Tradition Feature"
        description: "Gain a feature from your monastic tradition."
  16:
    proficiencyBonus: 5
    features:
      - name: "Ability Score Improvement"
        choices:
          asiOrFeat:
            type: AsiOrFeat
            required: true
  17:
    proficiencyBonus: 6
    features:
      - name: "Monastic Tradition Feature"
        description: "Gain a feature from your monastic tradition."
  18:
    proficiencyBonus: 6
    features:
      - name: "Empty Body"
        description: "Spend 4 ki: invisible for 1 min, resistance to all damage but force."
  19:
    proficiencyBonus: 6
    features:
      - name: "Ability Score Improvement"
        choices:
          asiOrFeat:
            type: AsiOrFeat
            required: true
  20:
    proficiencyBonus: 6
    features:
      - name: "Perfect Self"
        description: "Roll initiative with <4 ki: regain 4 ki."