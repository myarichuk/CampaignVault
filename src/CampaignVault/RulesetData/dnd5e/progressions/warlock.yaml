        description: "Gain a feature from your patron."
    spellSlots: {5: 1, 4: 1, 3: 2}
  15:
    proficiencyBonus: 5
    features:
      - name: "Mystic Arcanum (8th)"
        description: "Gain one 8th-level spell. Cast once per long rest."
    spellSlots: {5: 1, 4: 1, 3: 2}
  16:
    proficiencyBonus: 5
    features:
      - name: "Ability Score Improvement"
        choices:
          asiOrFeat:
            type: AsiOrFeat
            required: true
    spellSlots: {5: 1, 4: 1, 3: 2}
  17:
