        description: "Once per day on short rest, recover spell slots up to half your wizard level (rounded up)."
  2:
    spellsKnown: 8
    proficiencyBonus: 2
    features:
      - name: "Arcane Tradition"
        description: "Choose your Arcane Tradition."
        choices:
          subclass:
            type: Enum
            required: true
            options:
              - id: evocation
                label: "School of Evocation"
                description: "Evocation savant, sculpt spells, potent cantrip, empowered evocation, overchannel."
                features:
                  2:
                    - name: "Evocation Savant"
                      description: "Copying an evocation spell into your spellbook takes half the gold and time."
                    - name: "Sculpt Spells"
                      description: "When you cast an evocation spell that affects creatures you can see, choose 1 + the spell's level of them: they succeed on its save and take no damage where they'd take half."
                  6:
                    - name: "Potent Cantrip"
                      description: "A creature that succeeds on a save against your cantrip takes half its damage (but no other effect)."
                  10:
                    - name: "Empowered Evocation"
                      description: "Add your Intelligence modifier to one damage roll of any wizard evocation spell you cast."
                  14:
                    - name: "Overchannel"
                      description: "When you cast a wizard spell of 1st to 5th level that deals damage, deal its maximum damage. After the first use before a long rest, each further use deals you 2d12 necrotic damage per spell level, rising by 1d12 each time; the damage ignores resistance and immunity."
