name: wizard
system: dnd5e
className: Wizard
hitDie: d6
aliases: [wizard]
keyAbility: [Intelligence]
savingThrows: [Intelligence, Wisdom]
levels:
  1:
    proficiencyBonus: 2
    features:
      - name: "Spellcasting"
        description: "Int is spellcasting ability. Prepare spells from spellbook."
      - name: "Arcane Recovery"
        description: "Once per day on short rest, recover spell slots up to half your wizard level (rounded up)."
  2:
    proficiencyBonus: 2
    features:
      - name: "Arcane Tradition"
        description: "Choose your Arcane Tradition."
        choices:
          subclass:
            type: Enum
            required: true
            options:
              - id: abjuration
                label: "School of Abjuration"
                description: "Protective magic and wards."
              - id: conjuration
                label: "School of Conjuration"
                description: "Summoning and teleportation."
              - id: divination
                label: "School of Divination"
                description: "Foresight and scrying."
              - id: enchantment
                label: "School of Enchantment"
                description: "Beguiling and controlling minds."
              - id: evocation
                label: "School of Evocation"
                description: "Raw elemental destruction."
              - id: illusion
                label: "School of Illusion"
                description: "Deceiving senses and minds."
              - id: necromancy
                label: "School of Necromancy"
                description: "Power over life and death."
              - id: transmutation
                label: "School of Transmutation"
                description: "Changing matter and energy."
  3:
    proficiencyBonus: 2
  4:
    proficiencyBonus: 2
    features:
      - name: "Ability Score Improvement"
        description: "Increase one ability by 2, or two abilities by 1, or take a feat."
        choices:
          asiOrFeat:
