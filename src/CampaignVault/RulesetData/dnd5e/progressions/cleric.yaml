# Source: SRD 5.1 by Wizards of the Coast LLC, CC BY 4.0
name: cleric
system: dnd5e
className: Cleric
hitDie: d8
savingThrows: [Wisdom, Charisma]
preparedSpells: { ability: Wisdom }
levels:
  1:
    cantripsKnown: 3
    proficiencyBonus: 2
    features:
      - name: "Spellcasting"
        description: "Wis is spellcasting ability. Prepare cleric spells. Domain spells always prepared."
        spellSlots: {1: 2}
      - name: "Divine Domain"
        description: "Choose a divine domain."
        choices:
          subclass:
            type: Enum
            required: true
            options:
              - id: life
                label: "Life Domain"
                description: "Heavy armor, disciple of life, preserve life, blessed healer, supreme healing."
                features:
                  1:
                    - name: "Bonus Proficiency"
                      description: "Proficiency with heavy armor."
                      proficiencies: { armor: [heavy] }
                    - name: "Disciple of Life"
                      description: "A spell of 1st level or higher that restores hit points restores 2 + the spell's level more."
                    - name: "Domain Spells"
                      description: "Always prepared, and not counted against the spells you prepare."
                      spells:
                        1: ["bless", "cure_wounds"]
                        3: ["lesser_restoration", "spiritual_weapon"]
                        5: ["beacon_of_hope", "revivify"]
                        7: ["death_ward", "guardian_of_faith"]
                        9: ["mass_cure_wounds", "raise_dead"]
                  2:
                    - name: "Channel Divinity: Preserve Life"
                      description: "Action: restore hit points equal to five times your cleric level, divided as you choose among creatures within 30 ft. No creature goes above half its hit point maximum. Doesn't work on undead or constructs."
                  6:
                    - name: "Blessed Healer"
                      description: "When a spell of 1st level or higher you cast restores another creature's hit points, you regain 2 + the spell's level hit points."
                  8:
                    - name: "Divine Strike"
                      description: "Once on each of your turns, when a weapon attack hits, it deals an extra 1d8 radiant damage (2d8 from 14th level)."
                      effects:
                        - { kind: extraDamage, dice: "1d8", damageType: radiant, toggle: divineStrike }
                  14:
                    - name: "Divine Strike (14th level)"
                      description: "Divine Strike's extra damage is 2d8 in all."
                      effects:
                        - { kind: extraDamage, dice: "1d8", damageType: radiant, toggle: divineStrike }
                  17:
                    - name: "Supreme Healing"
                      description: "Instead of rolling the dice of a healing spell, use the highest number each die could roll."
  2:
    proficiencyBonus: 2
    features:
      - name: "Channel Divinity (1/rest)"
        description: "Use Channel Divinity feature from your domain."
    spellSlots: {1: 3}
  3:
    proficiencyBonus: 2
    spellSlots: {1: 4, 2: 2}
  4:
    cantripsKnown: 4
    proficiencyBonus: 2
    features:
      - name: "Ability Score Improvement"
        choices:
          asiOrFeat:
            type: AsiOrFeat
            required: true
    spellSlots: {1: 4, 2: 3}
  5:
    proficiencyBonus: 3
    features:
      - name: "Destroy Undead (CR 1/2)"
        description: "Turn undead: destroyed if CR 1/2 or lower."
    spellSlots: {1: 4, 2: 3, 3: 2}
  6:
    proficiencyBonus: 3
    features:
      - name: "Channel Divinity (2/rest)"
        description: "Can use Channel Divinity twice per short/long rest."
      - name: "Divine Domain Feature"
        description: "Gain a feature from your divine domain."
    spellSlots: {1: 4, 2: 3, 3: 3}
  7:
    proficiencyBonus: 3
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 1}
  8:
    proficiencyBonus: 3
    features:
      - name: "Divine Domain Feature"
        description: "Gain a feature from your divine domain."
      - name: "Destroy Undead (CR 1)"
      - name: "Ability Score Improvement"
        choices:
          asiOrFeat:
            type: AsiOrFeat
            required: true
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 2}
  9:
    proficiencyBonus: 4
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 1}
  10:
    cantripsKnown: 5
    proficiencyBonus: 4
    features:
      - name: "Divine Intervention"
        description: "Call on deity for aid. % chance = cleric level. Succeeds automatically at 20th."
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 2}
  11:
    proficiencyBonus: 4
    features:
      - name: "Destroy Undead (CR 2)"
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 2, 6: 1}
  12:
    proficiencyBonus: 4
    features:
      - name: "Ability Score Improvement"
        choices:
          asiOrFeat:
            type: AsiOrFeat
            required: true
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 2, 6: 1}
  13:
    proficiencyBonus: 5
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 2, 6: 1, 7: 1}
  14:
    proficiencyBonus: 5
    features:
      - name: "Destroy Undead (CR 3)"
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 2, 6: 1, 7: 1}
  15:
    proficiencyBonus: 5
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 2, 6: 1, 7: 1, 8: 1}
  16:
    proficiencyBonus: 5
    features:
      - name: "Ability Score Improvement"
        choices:
          asiOrFeat:
            type: AsiOrFeat
            required: true
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 2, 6: 1, 7: 1, 8: 1}
  17:
    proficiencyBonus: 6
    features:
      - name: "Destroy Undead (CR 4)"
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 2, 6: 1, 7: 1, 8: 1, 9: 1}
  18:
    proficiencyBonus: 6
    features:
      - name: "Divine Domain Feature"
        description: "Gain a feature from your divine domain."
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 2, 6: 1, 7: 1, 8: 1, 9: 1}
  19:
    proficiencyBonus: 6
    features:
      - name: "Ability Score Improvement"
        choices:
          asiOrFeat:
            type: AsiOrFeat
            required: true
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 2, 6: 1, 7: 1, 8: 1, 9: 1}
  20:
    proficiencyBonus: 6
    features:
      - name: "Divine Intervention Improvement"
        description: "Divine Intervention succeeds automatically."
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 2, 6: 1, 7: 1, 8: 1, 9: 1}