# Source: SRD 5.1 by Wizards of the Coast LLC, CC BY 4.0
name: sorcerer
system: dnd5e
className: Sorcerer
hitDie: d6
aliases: [sorcerer]
savingThrows: [Constitution, Charisma]
levels:
  1:
    cantripsKnown: 4
    spellsKnown: 2
    proficiencyBonus: 2
    features:
      - name: "Spellcasting"
        description: "Cha is spellcasting ability. Know 4 cantrips, 2 spells. Sorcerous origin spells."
        spellSlots: {1: 2}
      - name: "Sorcerous Origin"
        description: "Choose a sorcerous origin."
        choices:
          subclass:
            type: Enum
            required: true
            options:
              - id: draconic
                label: "Draconic Bloodline"
                description: "Dragon ancestor, draconic resilience, elemental affinity, dragon wings, draconic presence."
                features:
                  1:
                    - name: "Dragon Ancestor"
                      description: "You speak, read and write Draconic. When you make a Charisma check interacting with dragons, your proficiency bonus is doubled if it applies."
                      choices:
                        dragonAncestor:
                          type: "Enum"
                          required: true
                          prompt: "Dragon Ancestor"
                          options:
                            - id: "black"
                              label: "Black dragon"
                              description: "Damage type: acid."
                            - id: "blue"
                              label: "Blue dragon"
                              description: "Damage type: lightning."
                            - id: "brass"
                              label: "Brass dragon"
                              description: "Damage type: fire."
                            - id: "bronze"
                              label: "Bronze dragon"
                              description: "Damage type: lightning."
                            - id: "copper"
                              label: "Copper dragon"
                              description: "Damage type: acid."
                            - id: "gold"
                              label: "Gold dragon"
                              description: "Damage type: fire."
                            - id: "green"
                              label: "Green dragon"
                              description: "Damage type: poison."
                            - id: "red"
                              label: "Red dragon"
                              description: "Damage type: fire."
                            - id: "silver"
                              label: "Silver dragon"
                              description: "Damage type: cold."
                            - id: "white"
                              label: "White dragon"
                              description: "Damage type: cold."
                    - name: "Draconic Resilience"
                      description: "Your hit point maximum rises by 1 per sorcerer level. Without armor, your AC is 13 + your Dexterity modifier."
                      hpPerLevel: 1
                      unarmoredArmorClass:
                        base: 13
                        abilities: ["Dexterity"]
                  6:
                    - name: "Elemental Affinity"
                      description: "When a spell you cast deals your ancestor's damage type, add your Charisma modifier to one damage roll of it. You can spend 1 sorcery point to gain resistance to that type for 1 hour."
                  14:
                    - name: "Dragon Wings"
                      description: "Bonus action: sprout dragon wings and gain a flying speed equal to your speed, until you dismiss them. Not through armor not made for them."
                  18:
                    - name: "Draconic Presence"
                      description: "Action, 5 sorcery points: for 1 minute (concentration), a 60-ft. aura of awe or fear; each hostile creature starting its turn there makes a Wisdom save or is charmed (awe) or frightened (fear) until the aura ends. A success makes it immune for 24 hours."
  2:
    spellsKnown: 3
    proficiencyBonus: 2
    features:
      - name: "Font of Magic"
        description: "Sorcery points = sorcerer level. Flexible casting (convert slots to points and vice versa)."
    spellSlots: {1: 3}
  3:
    spellsKnown: 4
    proficiencyBonus: 2
    features:
      - name: "Metamagic"
        description: "Choose two metamagic options (Careful, Distant, Empowered, Extended, Heightened, Quickened, Subtle, Twinned)."
        choices:
          metamagic:
            type: Enum
            required: true
            count: 2
            options:
              - id: careful
                label: "Careful Spell"
                description: "Spend 1 sorcery point: chosen creatures auto-succeed on save vs your spell."
              - id: distant
                label: "Distant Spell"
                description: "Spend 1 sorcery point: double spell range or touch becomes 30 ft."
              - id: empowered
                label: "Empowered Spell"
                description: "Spend 1 sorcery point: reroll damage dice up to Cha mod times."
              - id: extended
                label: "Extended Spell"
                description: "Spend 1 sorcery point: double duration (max 24 hrs)."
              - id: heightened
                label: "Heightened Spell"
                description: "Spend 3 sorcery points: target has disadvantage on first save vs spell."
              - id: quickened
                label: "Quickened Spell"
                description: "Spend 2 sorcery points: change action to bonus action."
              - id: subtle
                label: "Subtle Spell"
                description: "Spend 1 sorcery point: cast without somatic/verbal components."
              - id: twinned
                label: "Twinned Spell"
                description: "Spend sorcery points = spell level: target second creature with single-target spell."
    spellSlots: {1: 4, 2: 2}
  4:
    cantripsKnown: 5
    spellsKnown: 5
    proficiencyBonus: 2
    features:
      - name: "Ability Score Improvement"
        choices:
          asiOrFeat:
            type: AsiOrFeat
            required: true
    spellSlots: {1: 4, 2: 3}
  5:
    spellsKnown: 6
    proficiencyBonus: 3
    features:
      - name: "Sorcerous Origin Feature"
        description: "Gain a feature from your sorcerous origin."
    spellSlots: {1: 4, 2: 3, 3: 2}
