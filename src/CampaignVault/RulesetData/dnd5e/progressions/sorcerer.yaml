    spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 2}
  11:
    proficiencyBonus: 4
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 2, 6: 1}
  12:
    proficiencyBonus: 4
    features:
      - name: "Ability Score Improvement"
        choices:
          asiOrFeat:
            type: AsiOrFeat
            required: true
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 2, 6: 1}
  13:
    proficiencyBonus: 5
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 2, 6: 1, 7: 1}
  14:
    proficiencyBonus: 5
    features:
      - name: "Sorcerous Origin Feature"
        description: "Gain a feature from your sorcerous origin."
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 2, 6: 1, 7: 1}
  15:
    proficiencyBonus: 5
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 2, 6: 1, 7: 1, 8: 1}
  16:
