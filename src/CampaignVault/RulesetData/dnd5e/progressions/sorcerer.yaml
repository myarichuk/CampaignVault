# Source: SRD 5.1 by Wizards of the Coast LLC, CC BY 4.0
name: sorcerer
system: dnd5e
className: Sorcerer
hitDie: d6
aliases: [sorcerer]
savingThrows: [Constitution, Charisma]
levels:
  1:
    proficiencyBonus: 2
    features:
      - name: "Spellcasting"
        description: "Cha is spellcasting ability. Know 4 cantrips, 2 spells. Sorcerous origin spells."
        spellSlots: {1: 2}
      - name: "Sorcerous Origin"
        description: "Choose a sorcerous origin."
        choices:
          subclass:
            type: Enum
            required: true
            options:
              - id: draconic
                label: "Draconic Bloodline"
                description: "Dragon ancestor, dragon resilience, elemental affinity, dragon wings, draconic presence."
              - id: wildMagic
                label: "Wild Magic"
                description: "Wild magic surge, tides of chaos, bend luck, controlled chaos, spell bombardment."
              - id: storm
                label: "Storm Sorcery"
                description: "Wind speaker, tempestuous magic, heart of the storm, storm guide, wind soul."
  2:
    proficiencyBonus: 2
    features:
      - name: "Font of Magic"
        description: "Sorcery points = sorcerer level. Flexible casting (convert slots to points and vice versa)."
      - name: "Metamagic"
        description: "Choose two metamagic options (Careful, Distant, Empowered, Extended, Heightened, Quickened, Subtle, Twinned)."
        choices:
          metamagic:
            type: Enum
            required: true
            options:
              - id: careful
                label: "Careful Spell"
                description: "Spend 1 sorcery point: chosen creatures auto-succeed on save vs your spell."
              - id: distant
                label: "Distant Spell"
                description: "Spend 1 sorcery point: double spell range or touch becomes 30 ft."
              - id: empowered
                label: "Empowered Spell"
                description: "Spend 1 sorcery point: reroll damage dice up to Cha mod times."
              - id: extended
                label: "Extended Spell"
                description: "Spend 1 sorcery point: double duration (max 24 hrs)."
              - id: heightened
                label: "Heightened Spell"
                description: "Spend 3 sorcery points: target has disadvantage on first save vs spell."
              - id: quickened
                label: "Quickened Spell"
                description: "Spend 2 sorcery points: change action to bonus action."
              - id: subtle
                label: "Subtle Spell"
                description: "Spend 1 sorcery point: cast without somatic/verbal components."
              - id: twinned
                label: "Twinned Spell"
                description: "Spend sorcery points = spell level: target second creature with single-target spell."
    spellSlots: {1: 3}
  3:
    proficiencyBonus: 2
    features:
      - name: "Metamagic"
        description: "Choose one more metamagic option."
        choices:
          metamagic:
            type: Enum
            required: true
    spellSlots: {1: 4, 2: 2}
  4:
    proficiencyBonus: 2
    features:
      - name: "Ability Score Improvement"
        choices:
          asiOrFeat:
            type: AsiOrFeat
            required: true
    spellSlots: {1: 4, 2: 3}
  5:
    proficiencyBonus: 3
    features:
      - name: "Sorcerous Origin Feature"
        description: "Gain a feature from your sorcerous origin."
    spellSlots: {1: 4, 2: 3, 3: 2}
  6:
    proficiencyBonus: 3
    features:
      - name: "Metamagic"
        description: "Choose one more metamagic option."
        choices:
          metamagic:
            type: Enum
            required: true
    spellSlots: {1: 4, 2: 3, 3: 3}
  7:
    proficiencyBonus: 3
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 1}
  8:
    proficiencyBonus: 3
    features:
      - name: "Ability Score Improvement"
        choices:
          asiOrFeat:
            type: AsiOrFeat
            required: true
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 2}
  9:
    proficiencyBonus: 4
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 1}
  10:
