    features:
      - name: "Indomitable (2)"
        description: "Can reroll failed saving throws twice per long rest."
  14:
    proficiencyBonus: 5
    features:
      - name: "Ability Score Improvement"
        description: "Increase one ability by 2, or two abilities by 1, or take a feat."
        choices:
          asiOrFeat:
            type: AsiOrFeat
            required: true
  15:
    proficiencyBonus: 5
    features:
      - name: "Martial Archetype Feature"
        description: "Gain a feature from your chosen martial archetype."
  16:
    proficiencyBonus: 5
    features:
      - name: "Ability Score Improvement"
        description: "Increase one ability by 2, or two abilities by 1, or take a feat."
        choices:
          asiOrFeat:
            type: AsiOrFeat
            required: true
  17:
