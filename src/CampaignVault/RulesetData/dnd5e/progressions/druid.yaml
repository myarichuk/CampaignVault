# Source: SRD 5.1 by Wizards of the Coast LLC, CC BY 4.0
name: druid
system: dnd5e
className: Druid
hitDie: d8
aliases: [druid]
savingThrows: [Intelligence, Wisdom]
levels:
  1:
    proficiencyBonus: 2
    features:
      - name: "Druidic"
        description: "Know the secret language of druids."
      - name: "Spellcasting"
        description: "Wis is spellcasting ability. Know 2 cantrips, prepare druid spells."
        spellSlots: {1: 2}
  2:
    proficiencyBonus: 2
    features:
      - name: "Wild Shape"
        description: "Use action to assume beast form (CR 1/4, no fly/swim). 2 uses per short/long rest."
      - name: "Druid Circle"
        description: "Choose a druid circle."
        choices:
          subclass:
            type: Enum
            required: true
            options:
              - id: land
                label: "Circle of the Land"
                description: "Bonus cantrip, natural recovery, land's stride, nature's ward, nature's sanctuary."
              - id: moon
                label: "Circle of the Moon"
                description: "Combat wild shape, circle forms, primal strike, elemental wild shape, thousand forms."
              - id: dreams
                label: "Circle of Dreams"
                description: "Balm of the summer court, hearth of moonlight, hidden paths, walker in dreams."
    spellSlots: {1: 3}
  3:
    proficiencyBonus: 2
    spellSlots: {1: 4, 2: 2}
  4:
    proficiencyBonus: 2
    features:
      - name: "Ability Score Improvement"
        choices:
          asiOrFeat:
            type: AsiOrFeat
            required: true
      - name: "Wild Shape Improvement"
        description: "CR 1/2, swimming speed."
    spellSlots: {1: 4, 2: 3}
  5:
    proficiencyBonus: 3
    features:
      - name: "Wild Shape Improvement"
        description: "CR 1, flying speed."
    spellSlots: {1: 4, 2: 3, 3: 2}
  6:
    proficiencyBonus: 3
    features:
      - name: "Circle Feature"
        description: "Gain a feature from your druid circle."
    spellSlots: {1: 4, 2: 3, 3: 3}
  7:
    proficiencyBonus: 3
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 1}
  8:
    proficiencyBonus: 3
    features:
      - name: "Ability Score Improvement"
        choices:
          asiOrFeat:
            type: AsiOrFeat
            required: true
      - name: "Wild Shape Improvement"
        description: "CR 1, flying/swimming speed."
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 2}
  9:
    proficiencyBonus: 4
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 1}
  10:
    proficiencyBonus: 4
    features:
      - name: "Timeless Body"
        description: "Age 1 year per 10. No magical aging."
      - name: "Circle Feature"
        description: "Gain a feature from your druid circle."
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 2}
  11:
    proficiencyBonus: 4
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 2, 6: 1}
  12:
    proficiencyBonus: 4
    features:
      - name: "Ability Score Improvement"
        choices:
          asiOrFeat:
            type: AsiOrFeat
            required: true
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 2, 6: 1}
  13:
    proficiencyBonus: 5
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 2, 6: 1, 7: 1}
  14:
    proficiencyBonus: 5
    features:
      - name: "Wild Shape Improvement"
        description: "CR 2, flying/swimming speed."
      - name: "Circle Feature"
        description: "Gain a feature from your druid circle."
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 2, 6: 1, 7: 1}
  15:
    proficiencyBonus: 5
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 2, 6: 1, 7: 1, 8: 1}
  16:
    proficiencyBonus: 5
    features:
      - name: "Ability Score Improvement"
        choices:
          asiOrFeat:
            type: AsiOrFeat
            required: true
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 2, 6: 1, 7: 1, 8: 1}
  17:
    proficiencyBonus: 6
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 2, 6: 1, 7: 1, 8: 1, 9: 1}
  18:
    proficiencyBonus: 6
    features:
      - name: "Timeless Body"
        description: "Age 1 year per 10. No magical aging."
      - name: "Beast Spells"
        description: "Can cast spells while in Wild Shape (no material components)."
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 2, 6: 1, 7: 1, 8: 1, 9: 1}
  19:
    proficiencyBonus: 6
    features:
      - name: "Ability Score Improvement"
        choices:
          asiOrFeat:
            type: AsiOrFeat
            required: true
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 2, 6: 1, 7: 1, 8: 1, 9: 1}
  20:
    proficiencyBonus: 6
    features:
      - name: "Archdruid"
        description: "Unlimited Wild Shape. Ignore verbal/somatic components. No material components for druid spells."
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 2, 6: 1, 7: 1, 8: 1, 9: 1}