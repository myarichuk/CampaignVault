# Source: SRD 5.1 by Wizards of the Coast LLC, CC BY 4.0
name: ranger
system: dnd5e
className: Ranger
hitDie: d10
aliases: [ranger]
savingThrows: [Strength, Dexterity]
levels:
  1:
    proficiencyBonus: 2
    features:
      - name: "Favored Enemy"
        description: "Advantage on Wis (Survival) and Int checks for chosen enemy type. Learn one language."
      - name: "Natural Explorer"
        description: "Double proficiency for Int/Wis checks for favored terrain. Benefits while traveling."
  2:
    spellsKnown: 2
    proficiencyBonus: 2
    features:
      - name: "Fighting Style"
        description: "Choose: Archery, Defense, Dueling or Two-Weapon Fighting."
        choices:
          fightingStyle:
            type: Enum
            required: true
            options:
              - id: archery
                label: "Archery"
                description: "+2 to attack rolls with ranged weapons."
                effects:
                  - { kind: attackBonus, value: 2, weapon: [ranged] }
              - id: defense
                label: "Defense"
                description: "+1 AC while wearing armor."
                effects:
                  - { kind: armorClassBonus, value: 1, assert: [wearingArmor], when: "the character is wearing armor" }
              - id: dueling
                label: "Dueling"
                description: "+2 damage with one-handed melee weapon."
                effects:
                  - { kind: damageBonus, value: 2, weapon: [melee, oneHanded] }
              - id: twoWeaponFighting
                label: "Two-Weapon Fighting"
                description: "Add ability modifier to off-hand attack damage."
    spellSlots: {1: 2}
  3:
    spellsKnown: 3
    proficiencyBonus: 2
    features:
      - name: "Ranger Archetype"
        description: "Choose a ranger archetype."
        choices:
          subclass:
            type: Enum
            required: true
            options:
              - id: hunter
                label: "Hunter"
                description: "Hunter's prey, defensive tactics, multiattack, superior hunter's defense."
                features:
                  3:
                    - name: "Hunter's Prey"
                      description: "Choose one."
                      choices:
                        huntersPrey:
                          type: "Enum"
                          required: true
                          prompt: "Hunter's Prey"
                          options:
                            - id: "colossusSlayer"
                              label: "Colossus Slayer"
                              description: "Once per turn, a weapon hit deals an extra 1d8 damage to a creature below its hit point maximum."
                              effects:
                                - { kind: extraDamage, dice: "1d8", toggle: colossusSlayer, assert: [targetHurt], when: "the target is below its hit point maximum" }
                            - id: "giantKiller"
                              label: "Giant Killer"
                              description: "When a Large or larger creature within 5 ft. hits or misses you with an attack, you can use your reaction to attack it right after, if you can see it."
                            - id: "hordeBreaker"
                              label: "Horde Breaker"
                              description: "Once on each of your turns, when you make a weapon attack, you can make another against a different creature within 5 ft. of the first target and in range."
                  7:
                    - name: "Defensive Tactics"
                      description: "Choose one."
                      choices:
                        defensiveTactics:
                          type: "Enum"
                          required: true
                          prompt: "Defensive Tactics"
                          options:
                            - id: "escapeTheHorde"
                              label: "Escape the Horde"
                              description: "Opportunity attacks against you have disadvantage."
                            - id: "multiattackDefense"
                              label: "Multiattack Defense"
                              description: "When a creature hits you with an attack, you gain +4 AC against its later attacks this turn."
                            - id: "steelWill"
                              label: "Steel Will"
                              description: "Advantage on saving throws against being frightened."
                  11:
                    - name: "Multiattack"
                      description: "Choose one."
                      choices:
                        multiattack:
                          type: "Enum"
                          required: true
                          prompt: "Multiattack"
                          options:
                            - id: "volley"
                              label: "Volley"
                              description: "Action: a ranged attack against any number of creatures within 10 ft. of a point you can see in range, with a separate roll and ammunition for each."
                            - id: "whirlwindAttack"
                              label: "Whirlwind Attack"
                              description: "Action: a melee attack against any number of creatures within 5 ft. of you, with a separate roll for each."
                  15:
                    - name: "Superior Hunter's Defense"
                      description: "Choose one."
                      choices:
                        superiorHuntersDefense:
                          type: "Enum"
                          required: true
                          prompt: "Superior Hunter's Defense"
                          options:
                            - id: "evasion"
                              label: "Evasion"
                              description: "When a Dexterity save would halve an area's damage, you take none on a success and half on a failure."
                            - id: "standAgainstTheTide"
                              label: "Stand Against the Tide"
                              description: "When a hostile creature misses you with a melee attack, you can use your reaction to have it repeat the attack against another creature (not itself) of your choice."
                            - id: "uncannyDodge"
                              label: "Uncanny Dodge"
                              description: "When an attacker you can see hits you, you can use your reaction to halve the attack's damage."
    spellSlots: {1: 3}
  4:
    proficiencyBonus: 2
    features:
      - name: "Ability Score Improvement"
        choices:
          asiOrFeat:
            type: AsiOrFeat
            required: true
    spellSlots: {1: 3}
  5:
    spellsKnown: 4
    proficiencyBonus: 3
    features:
      - name: "Extra Attack"
        description: "Attack twice when you take the Attack action."
      - name: "Spellcasting (2nd level)"
        description: "Gain 2nd-level spell slots."
    spellSlots: {1: 4, 2: 2}
  6:
    proficiencyBonus: 3
    features:
      - name: "Favored Enemy & Natural Explorer Improvements"
        description: "Add another favored enemy and language, another favored terrain."
    spellSlots: {1: 4, 2: 3}
  7:
    spellsKnown: 5
    proficiencyBonus: 3
    features:
      - name: "Archetype Feature"
        description: "Gain a feature from your ranger archetype."
    spellSlots: {1: 4, 2: 3}
  8:
    proficiencyBonus: 3
    features:
      - name: "Ability Score Improvement"
        choices:
          asiOrFeat:
            type: AsiOrFeat
            required: true
      - name: "Land's Stride"
        description: "Nonmagical difficult terrain costs no extra movement. Advantage vs plants."
    spellSlots: {1: 4, 2: 3}
  9:
    spellsKnown: 6
    proficiencyBonus: 4
    spellSlots: {1: 4, 2: 3, 3: 2}
  10:
    proficiencyBonus: 4
    features:
      - name: "Hide in Plain Sight"
        description: "Spend 1 min camouflaging: +10 to Dex (Stealth) while stationary."
    spellSlots: {1: 4, 2: 3, 3: 3}
  11:
    spellsKnown: 7
    proficiencyBonus: 4
    features:
      - name: "Archetype Feature"
        description: "Gain a feature from your ranger archetype."
    spellSlots: {1: 4, 2: 3, 3: 3}
  12:
    proficiencyBonus: 4
    features:
      - name: "Ability Score Improvement"
        choices:
          asiOrFeat:
            type: AsiOrFeat
            required: true
    spellSlots: {1: 4, 2: 3, 3: 3}
  13:
    spellsKnown: 8
    proficiencyBonus: 5
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 1}
  14:
    proficiencyBonus: 5
    features:
      - name: "Vanish"
        description: "Bonus action Hide. Can't be tracked by nonmagical means."
      - name: "Archetype Feature"
        description: "Gain a feature from your ranger archetype."
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 1}
  15:
    spellsKnown: 9
    proficiencyBonus: 5
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 2}
  16:
    proficiencyBonus: 5
    features:
      - name: "Ability Score Improvement"
        choices:
          asiOrFeat:
            type: AsiOrFeat
            required: true
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 2}
  17:
    spellsKnown: 10
    proficiencyBonus: 6
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 1}
  18:
    proficiencyBonus: 6
    features:
      - name: "Feral Senses"
        description: "Attack invisible creatures without disadvantage. Aware of invisible within 30 ft."
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 1}
  19:
    spellsKnown: 11
    proficiencyBonus: 6
    features:
      - name: "Ability Score Improvement"
        choices:
          asiOrFeat:
            type: AsiOrFeat
            required: true
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 2}
  20:
    proficiencyBonus: 6
    features:
      - name: "Foe Slayer"
        description: "Add Wis mod to attack roll or damage roll vs favored enemies."
    spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 2}