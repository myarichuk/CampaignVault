# Character builder recipe: a D&D 5e player character. Steps run in this order; each step's choice is stored in the
# draft under its key. Plugins add steps with `patches: pc` + `steps+:` (and `after: <key>` to place them).
# Step kinds, sources and validators: PLUGINS.md.
name: pc
system: dnd5e
# Levels 2-20: the levels step asks for every choice the class's progression makes up to the draft's level.
maxLevel: 20
steps:
  - { key: race, kind: pickOne, source: races, prompt: Race }
  - { key: class, kind: pickOne, source: classes, prompt: Class }
  # Named powers (gods, patrons, bloodlines) are plugin or homebrew content, so these steps show only when one fits the class.
  - { key: deity, kind: pickOne, source: deities, optional: true, prompt: Deity }
  - { key: patron, kind: pickOne, source: patrons, optional: true, prompt: Patron }
  - { key: lineage, kind: pickOne, source: lineages, optional: true, prompt: Lineage }
  - { key: background, kind: pickOne, source: backgrounds, prompt: Background }
  - key: abilities
    kind: abilityScores
    prompt: Ability scores
    methods:
      standardArray: [15, 14, 13, 12, 10, 8]
      pointBuy: { budget: 27, min: 8, max: 15, cost: { 8: 0, 9: 1, 10: 2, 11: 3, 12: 4, 13: 5, 14: 7, 15: 9 } }
      roll: 4d6dropLowest
  - key: skills
    kind: pickN
    prompt: Skills
    source: classSkills
    countFrom: class.skillChoices.count
    exclude: background.skillProficiencies
  # Subclass, fighting style, ability score improvements...: shown when the class has a choice at or below the level.
  # Before spells, so an improvement to the casting ability is in the prepared count.
  - { key: levels, kind: levelChoices, prompt: Level choices }
  - { key: spells, kind: spells, source: spells, when: "spellcasting != None", prompt: Spells }
  - { key: identity, kind: identity, prompt: Who they are }
