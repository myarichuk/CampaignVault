name: exhaustion
system: dnd5e
durationType: UntilLongRest
isStacking: true
isSurvivalExhaustion: true
mechanicalSummary: >
  Level 1: disadvantage on ability checks. Level 2: speed halved. Level 3: disadvantage on attack rolls and saving throws.
  Level 4: hit point maximum halved. Level 5: speed becomes 0. Level 6: death.
  A creature suffers the effects of its current level and all lower levels. Long rest reduces level by 1 (with food and drink).
moodHint: depleted, wearied
immunities: []
suppresses: []
# Cumulative: a creature at level N has the effects of levels 1 to N.
levels:
  1:
    - { kind: disadvantage, on: check }
  2:
    - { kind: speed, multiplier: 0.5 }
  3:
    - { kind: disadvantage, on: attack }
    - { kind: disadvantage, on: save }
  4:
    - { kind: maxHpMultiplier, multiplier: 0.5 }
  5:
    - { kind: speed, set: 0 }
  6:
    - { kind: death }
